name: Upstream sync check

# Watches excalidraw/excalidraw for new commits and opens (or updates) a
# tracking issue listing what changed and which of those files this fork has
# also modified — i.e. where the merge will conflict.
#
# It deliberately does not auto-merge: `yarn fork:sync` locally, where the build
# and tests can be checked before anything is published.

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays, 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/excalidraw/excalidraw.git
          git fetch upstream --tags --prune

      - name: Compare with upstream
        id: compare
        run: |
          BASE=$(git merge-base HEAD upstream/master)
          HEAD_SHA=$(git rev-parse upstream/master)

          if [ "$BASE" = "$HEAD_SHA" ]; then
            echo "behind=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          COUNT=$(git rev-list --count "$BASE..upstream/master")
          echo "behind=$COUNT" >> "$GITHUB_OUTPUT"
          echo "sha=${HEAD_SHA:0:7}" >> "$GITHUB_OUTPUT"

          git log --oneline "$BASE..upstream/master" | head -30 > /tmp/commits.txt
          git diff --name-only "$BASE..upstream/master" | sort > /tmp/upstream-files.txt
          git diff --name-only "$BASE..HEAD"           | sort > /tmp/fork-files.txt
          comm -12 /tmp/upstream-files.txt /tmp/fork-files.txt > /tmp/overlap.txt

          UPSTREAM_VERSION=$(git show upstream/master:packages/excalidraw/package.json | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version")
          echo "upstream_version=$UPSTREAM_VERSION" >> "$GITHUB_OUTPUT"

          {
            echo "body<<EOF"
            echo "Upstream is **$COUNT commit(s)** ahead (\`${HEAD_SHA:0:7}\`, \`@excalidraw/excalidraw@$UPSTREAM_VERSION\`)."
            echo
            echo "### Commits"
            echo '```'
            cat /tmp/commits.txt
            echo '```'
            echo
            if [ -s /tmp/overlap.txt ]; then
              echo "### ⚠ Files changed both upstream and in this fork"
              echo
              echo "These will conflict on merge:"
              echo '```'
              cat /tmp/overlap.txt
              echo '```'
            else
              echo "### ✔ No overlap with fork-modified files"
              echo
              echo "The merge should apply cleanly."
            fi
            echo
            echo "### To sync"
            echo '```bash'
            echo "yarn fork:sync"
            echo "yarn install && yarn build && yarn test:run"
            echo "yarn fork:revision 1   # if the upstream version changed"
            echo "yarn fork:pack"
            echo '```'
            echo
            echo "See [FORK.md](../blob/master/FORK.md)."
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Always surface the report, even if issues are unavailable
      - name: Job summary
        if: steps.compare.outputs.behind != '0'
        env:
          BODY: ${{ steps.compare.outputs.body }}
        run: echo "$BODY" >> "$GITHUB_STEP_SUMMARY"

      - name: Open or update tracking issue
        if: steps.compare.outputs.behind != '0'
        uses: actions/github-script@v7
        env:
          BODY: ${{ steps.compare.outputs.body }}
          SHA: ${{ steps.compare.outputs.sha }}
          BEHIND: ${{ steps.compare.outputs.behind }}
        with:
          script: |
            const title = `Upstream sync: ${process.env.BEHIND} commit(s) behind (${process.env.SHA})`;
            const marker = '<!-- upstream-sync-tracker -->';
            const body = `${marker}\n\n${process.env.BODY}`;
            const { owner, repo } = context.repo;

            // Forks have issues disabled by default. The report is already in the
            // job summary, so warn rather than failing the run.
            const { data: repoInfo } = await github.rest.repos.get({ owner, repo });
            if (!repoInfo.has_issues) {
              core.warning('Issues are disabled on this repository — see the job summary for the report.');
              return;
            }

            // The label may not exist yet; create it rather than failing.
            try {
              await github.rest.issues.getLabel({ owner, repo, name: 'upstream-sync' });
            } catch {
              await github.rest.issues.createLabel({
                owner,
                repo,
                name: 'upstream-sync',
                color: '0E8A16',
                description: 'Upstream has new commits to merge',
              });
            }

            const { data: issues } = await github.rest.issues.listForRepo({
              owner,
              repo,
              state: 'open',
              labels: 'upstream-sync',
            });

            const existing = issues.find((i) => i.body?.includes(marker));

            if (existing) {
              await github.rest.issues.update({
                owner,
                repo,
                issue_number: existing.number,
                title,
                body,
              });
              core.info(`Updated #${existing.number}`);
              return;
            }

            const { data: created } = await github.rest.issues.create({
              owner,
              repo,
              title,
              body,
              labels: ['upstream-sync'],
            });
            core.info(`Created #${created.number}`);
